name: wdk-driver-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdk-driver.yml'
      - 'Directory.Build.props'
      - 'packages.config'
      - 'driver/**'
      - 'shared/**'
  pull_request:
    paths:
      - '.github/workflows/wdk-driver.yml'
      - 'Directory.Build.props'
      - 'packages.config'
      - 'driver/**'
      - 'shared/**'

permissions:
  contents: read

concurrency:
  group: wdk-driver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WDK_NUGET_VERSION: 10.0.26100.6584
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-and-validate:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out validation source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Prepare validation evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\wdk-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null

          $os = Get-CimInstance Win32_OperatingSystem
          $msbuildPath = (Get-Command msbuild -ErrorAction Stop).Source
          $msbuildVersion = (& $msbuildPath -version -nologo |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -Last 1).Trim()
          $checkedOutSha = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to resolve the checked-out Git commit.'
          }

          @(
            "SourceSha=$env:SOURCE_SHA"
            "CheckedOutSha=$checkedOutSha"
            "RunnerImage=$env:ImageOS"
            "RunnerImageVersion=$env:ImageVersion"
            "OSCaption=$($os.Caption)"
            "OSVersion=$($os.Version)"
            "MSBuildPath=$msbuildPath"
            "MSBuildVersion=$msbuildVersion"
            "WDKNuGetVersion=$env:WDK_NUGET_VERSION"
          ) | Set-Content -LiteralPath (Join-Path $evidenceRoot 'environment.txt') -Encoding utf8NoBOM

      - name: Ensure Visual Studio 2022 WDK component
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\wdk-evidence'
          $componentLog = Join-Path $evidenceRoot 'visual-studio-wdk-component.txt'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudioRange = '[17.0,18.0)'

          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found at $vswhere"
          }

          $installationPath = & $vswhere -latest -version $visualStudioRange -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw 'No Visual Studio 2022 installation with the x64 C++ toolset was found.'
          }

          $installationPath = $installationPath.Trim()
          "VisualStudioPath=$installationPath" | Set-Content -LiteralPath $componentLog

          $wdkInstallation = & $vswhere -latest -version $visualStudioRange -products * -requires Microsoft.Windows.DriverKit -property installationPath | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($wdkInstallation)) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            if (-not (Test-Path -LiteralPath $installer)) {
              throw "Visual Studio Installer was not found at $installer"
            }

            'Microsoft.Windows.DriverKit is not present in Visual Studio 2022; installing it.' | Add-Content -LiteralPath $componentLog
            $arguments = @(
              'modify'
              '--installPath'
              ('"' + $installationPath + '"')
              '--channelId'
              'VisualStudio.17.Release'
              '--add'
              'Microsoft.Windows.DriverKit'
              '--quiet'
              '--norestart'
              '--nocache'
            )
            $startParameters = @{
              FilePath = $installer
              ArgumentList = $arguments
              WorkingDirectory = $env:GITHUB_WORKSPACE
              Wait = $true
              PassThru = $true
            }
            $process = Start-Process @startParameters

            "InstallerExitCode=$($process.ExitCode)" | Add-Content -LiteralPath $componentLog
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Visual Studio Installer failed with exit code $($process.ExitCode)."
            }
          }
          else {
            'Microsoft.Windows.DriverKit is already present in Visual Studio 2022.' | Add-Content -LiteralPath $componentLog
          }

          $verifiedPath = & $vswhere -latest -version $visualStudioRange -products * -requires Microsoft.Windows.DriverKit -property installationPath | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($verifiedPath)) {
            throw 'Microsoft.Windows.DriverKit was not detected in Visual Studio 2022 after installation.'
          }

          $installationVersion = & $vswhere -latest -version $visualStudioRange -products * -requires Microsoft.Windows.DriverKit -property installationVersion | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($installationVersion) -or $installationVersion.Trim() -notmatch '^17\.') {
            throw "Expected Visual Studio 2022 (17.x); observed version: $installationVersion"
          }

          "VerifiedVisualStudioPath=$($verifiedPath.Trim())" | Add-Content -LiteralPath $componentLog
          "VisualStudioVersion=$($installationVersion.Trim())" | Add-Content -LiteralPath $componentLog

      - name: Restore pinned WDK and SDK packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\wdk-evidence'
          $restoreLog = Join-Path $evidenceRoot 'nuget-restore.log'
          $restoreArguments = @(
            'restore'
            '.\packages.config'
            '-PackagesDirectory'
            '.\packages'
            '-NonInteractive'
            '-Verbosity'
            'normal'
          )

          & nuget @restoreArguments 2>&1 | Tee-Object -FilePath $restoreLog
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed with exit code $LASTEXITCODE."
          }

          $version = $env:WDK_NUGET_VERSION
          $expectedFiles = @(
            ".\packages\Microsoft.Windows.WDK.x64.$version\build\native\Microsoft.Windows.WDK.x64.props"
            ".\packages\Microsoft.Windows.SDK.CPP.x64.$version\build\native\Microsoft.Windows.SDK.cpp.x64.props"
            ".\packages\Microsoft.Windows.SDK.CPP.$version\build\native\Microsoft.Windows.SDK.cpp.props"
          )

          foreach ($file in $expectedFiles) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Required pinned toolchain file was not restored: $file"
            }
            "Verified=$file" | Add-Content -LiteralPath $restoreLog
          }

      - name: Build KMDF driver with the pinned WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\wdk-evidence'

          foreach ($configuration in @('Debug', 'Release')) {
            $buildLog = Join-Path $evidenceRoot "build-$($configuration.ToLowerInvariant()).log"
            $arguments = @(
              '.\driver\KernelScopeDriver.vcxproj'
              '/m'
              '/t:Rebuild'
              '/nologo'
              '/verbosity:minimal'
              "/p:Configuration=$configuration"
              '/p:Platform=x64'
              '/p:UsePinnedWdkNuGet=true'
              '/p:TargetPlatformVersion=10.0.26100.0'
              '/p:WindowsTargetPlatformVersion=10.0.26100.0'
              '/p:SignMode=Off'
              '/p:EnableInf2cat=false'
            )

            & msbuild @arguments 2>&1 | Tee-Object -FilePath $buildLog
            if ($LASTEXITCODE -ne 0) {
              throw "$configuration WDK build failed with exit code $LASTEXITCODE."
            }
          }

      - name: Validate INF and unsigned driver output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\wdk-evidence'
          $stageRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\wdk-stage'
          New-Item -ItemType Directory -Path $stageRoot -Force | Out-Null

          $releaseDriver = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'driver') -Filter 'KernelScopeDriver.sys' -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]Release[\\/]' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $releaseDriver) {
            throw 'The Release x64 driver binary was not produced.'
          }

          $releaseInfPath = Join-Path $releaseDriver.Directory.FullName 'KernelScopeDriver.inf'
          if (-not (Test-Path -LiteralPath $releaseInfPath -PathType Leaf)) {
            throw 'The stamped Release x64 INF was not produced beside the driver.'
          }

          $stagedDriver = Copy-Item -LiteralPath $releaseDriver.FullName -Destination (Join-Path $stageRoot 'KernelScopeDriver.sys') -PassThru
          $stagedInf = Copy-Item -LiteralPath $releaseInfPath -Destination (Join-Path $stageRoot 'KernelScopeDriver.inf') -PassThru

          $infVerifCandidates = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'packages') -Filter 'InfVerif.exe' -File -Recurse
          $infVerif = $infVerifCandidates | Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (-not $infVerif) {
            $infVerif = $infVerifCandidates | Select-Object -First 1
          }
          if (-not $infVerif) {
            throw 'InfVerif.exe was not found in the restored WDK package.'
          }

          $infLog = Join-Path $evidenceRoot 'infverif.log'
          @(
            "Tool=$($infVerif.FullName)"
            'Mode=/u'
            "Input=$($stagedInf.FullName)"
          ) | Set-Content -LiteralPath $infLog -Encoding utf8NoBOM

          Push-Location $infVerif.Directory.FullName
          try {
            & $infVerif.FullName /u $stagedInf.FullName 2>&1 |
              Tee-Object -FilePath $infLog -Append
            $infVerifExitCode = $LASTEXITCODE
            "ExitCode=$infVerifExitCode" | Add-Content -LiteralPath $infLog
            if ($infVerifExitCode -ne 0) {
              throw "InfVerif /u failed with exit code $infVerifExitCode."
            }
          }
          finally {
            Pop-Location
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $stagedDriver.FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "Hosted CI output must remain unsigned; observed status: $($signature.Status)."
          }

          $driverHash = Get-FileHash -LiteralPath $stagedDriver.FullName -Algorithm SHA256
          @(
            'DriverFile=driver\x64\Release\KernelScopeDriver.sys'
            'InfFile=driver\x64\Release\KernelScopeDriver.inf'
            "DriverBytes=$($stagedDriver.Length)"
            "DriverSha256=$($driverHash.Hash.ToLowerInvariant())"
            "SignatureStatus=$($signature.Status)"
            "InfVerifPath=$($infVerif.FullName)"
            'InfVerifMode=/u'
          ) | Set-Content -LiteralPath (Join-Path $evidenceRoot 'output-manifest.txt') -Encoding utf8NoBOM

      - name: Enforce evidence-only artifact policy
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\wdk-evidence'
          if (-not (Test-Path -LiteralPath $evidenceRoot)) {
            throw 'The WDK evidence directory was not created.'
          }

          $allowedExtensions = @('.txt', '.log')
          $unexpected = Get-ChildItem -LiteralPath $evidenceRoot -File -Recurse |
            Where-Object { $_.Extension.ToLowerInvariant() -notin $allowedExtensions }
          if ($unexpected) {
            $names = ($unexpected.FullName -join ', ')
            throw "Only text evidence may be uploaded; unexpected files: $names"
          }

          $forbiddenExtensions = @(
            '.sys', '.cat', '.cer', '.pfx', '.pvk', '.key', '.exe', '.dll'
          )
          $forbidden = Get-ChildItem -LiteralPath $evidenceRoot -File -Recurse |
            Where-Object { $_.Extension.ToLowerInvariant() -in $forbiddenExtensions }
          if ($forbidden) {
            $names = ($forbidden.FullName -join ', ')
            throw "Forbidden binary or signing material entered the evidence artifact: $names"
          }

      - name: Upload WDK validation evidence
        if: ${{ always() && hashFiles('artifacts/wdk-evidence/**') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: wdk-validation-evidence
          path: artifacts/wdk-evidence
          if-no-files-found: error
          retention-days: 14

# Hosted CI compiles and validates the driver package but never installs,
# starts, signs, or uploads the driver binary.
