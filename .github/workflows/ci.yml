name: user-mode-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build collector
        run: msbuild collector\KernelScopeCollector.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build offline tests
        run: msbuild tests\KernelScopeTests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Run offline tests
        shell: pwsh
        run: |
          $testBinary = Join-Path $env:GITHUB_WORKSPACE "tests\x64\Release\KernelScopeTests.exe"
          $logPath = Join-Path $env:GITHUB_WORKSPACE "offline-tests.log"

          if (-not (Test-Path -LiteralPath $testBinary)) {
            "Test executable not found: $testBinary" | Set-Content -LiteralPath $logPath
            throw "Offline test executable was not produced."
          }

          & $testBinary *>&1 | Tee-Object -FilePath $logPath
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { exit $testExitCode }
      - name: Upload user-mode test log
        if: ${{ always() && hashFiles('offline-tests.log') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: offline-test-log
          path: offline-tests.log
          if-no-files-found: error

# Hosted runners never install, start, test, or upload the kernel driver.

