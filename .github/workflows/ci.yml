name: user-mode-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v3
      - name: Build collector
        run: msbuild collector\KernelScopeCollector.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build offline tests
        run: msbuild tests\KernelScopeTests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Run offline tests
        shell: pwsh
        run: |
          & .\tests\x64\Release\KernelScopeTests.exe *>&1 | Tee-Object -FilePath offline-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload user-mode test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-log
          path: offline-tests.log
          if-no-files-found: error

# Hosted runners never install, start, test, or upload the kernel driver.

